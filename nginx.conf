# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user root;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;


    server {
        listen       80;
        # listen       [::]:80;
        server_name  _;
        root         /dist;

        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
        
        # API 代理配置 - 对应 vite.config.ts 中的 /api 代理
        location ^~ /api/ {
            proxy_pass http://agrox.horai.cn:18030;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # XLYK 代理配置 - 对应 vite.config.ts 中的 /xlyk 代理
        # 重写路径：去掉 /xlyk 前缀，与 vite 配置保持一致
        location ^~ /xlyk/ {
            proxy_pass https://api.satlic.net:8020/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_verify off;
        }

        # # 图片文件代理配置 - 对应 vite.config.ts 中的 /img 代理
        # # 注意：您需要根据实际的 VITE_BASE_BUCKET 值替换下方的地址
        # location ^~ /img/ {
        #     proxy_pass http://your-bucket-url/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # # 文件代理配置 - 对应 vite.config.ts 中的 /file 代理
        # # 注意：您需要根据实际的 VITE_BASE_FILE 值替换下方的地址
        # location ^~ /file/ {
        #     proxy_pass http://your-file-url/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        location ^~ /assets/ {
            alias /dist/assets/;
        }

        location ~ /* {
            try_files $uri $uri/ /index.html;
            index index.html;
        }

        location /healthcheck {
            default_type text/plain;
            return 200 "ok";
        }
        index index.html index.htm;
        access_log /dist/access.log;
        error_log /dist/error.log;
    }
}
